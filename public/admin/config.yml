# تنظیمات بک‌اند: محتوا کجا ذخیره بشه؟
backend:
  name: github
  repo: YOUR_USERNAME/YOUR_REPO_NAME # ⚠️ اینو باید عوض کنی
  branch: main # یا master، بستگی به برنچ اصلیت داره

# تنظیمات آپلود عکس (اختیاری، بعداً استفاده می‌کنیم)
media_folder: "public/images"
public_folder: "/images"

# اینجا نوع محتواهامون رو تعریف می‌کنیم
collections:
  - name: "blog"
    label: "پست‌های وبلاگ"
    label_singular: "پست وبلاگ"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - {
          label: "تاریخ انتشار",
          name: "date",
          widget: "datetime",
          default: "{{now}}",
        }
      - { label: "خلاصه", name: "excerpt", widget: "text", required: false }
      - { label: "متن اصلی", name: "body", widget: "markdown" }
